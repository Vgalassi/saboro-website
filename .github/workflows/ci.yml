name: Pipeline

#Vai ativar quando ocorrer push no ci-test ou pull_resquest
on:
  push:
    branches: ["ci-test"]
  pull_request:

jobs:
  #Testes unitários!
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest

    steps: #Clonando repositório na vm
      - uses: actions/checkout@v3
      #Baixando node
      - name: Instalando node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      #Baixando dependências
      - name: Baixando depedências
        working-directory: ./backend
        run: npm install
      #Definindo ambiente para teste e executando testes unitários
      - name: Executando testes unitários
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: npm run test:unit

  #Testes de integração
  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: unit-tests #Só executa depois do unitário

    services:
      #criando banco de dados 
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saboro_test
        ports: #Expõe porta 3306
          - 3306:3306
          
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10 
          

    steps: #clona o repositório
      - uses: actions/checkout@v3
      #Node e depedências
      - name: Instalando Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Instalando Dependências
        working-directory: ./backend
        run: npm install
    #Espera o mysql 
      - name: Esperando o MySql
        run: |
          for i in {1..15}; do
            nc -z 127.0.0.1 3306 && echo "MySQL esta pronto" && break
            echo "Waiting MySQL..."
            sleep 4
          done

      - name: Rodando testes de integração
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: saboro_test
          NODE_ENV: test
        run: npm run test:integration
