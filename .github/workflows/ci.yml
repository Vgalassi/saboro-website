name: CI de Testes (Backend e Frontend)

# Controla quando o workflow será executado
on:
  push:
    branches: [ main ] # Altere 'main' se sua branch principal for outra
  pull_request:
    branches: [ main ] # Altere 'main' se sua branch principal for outra

jobs:
  # -----------------------------------------------
  # Job 1: Rodar Testes Unitários do Backend
  # -----------------------------------------------
  backend-unit-tests:
    [cite_start]runs-on: ubuntu-latest # O "sandbox" do GitHub [cite: 15]

    services:
      # [cite_start]Inicia um container Docker com o banco de dados MySQL [cite: 16]
      # Isso garante que seus testes tenham um BD real para se conectar
      mysql-db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root # Senha que você usa no database.js
          MYSQL_DATABASE: saboro     # Nome do banco que você usa no database.js
        ports:
          - 3306:3306 # Expõe a porta do BD para o runner
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Use a versão do Node que você usa localmente

      - name: 3. Instalar Dependências do Backend
        # 'npm ci' é mais rápido e seguro para CI do que 'npm install'
        run: npm ci

      - name: 4. Rodar Testes Unitários (Jest)
        run: npm test
        env:
          # Informa ao app Node.js como se conectar ao container do BD
          # Veja o "Passo de Preparação 1" abaixo
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: saboro
          CI: true

  # -----------------------------------------------
  # Job 2: Rodar Testes E2E (Cypress)
  # -----------------------------------------------
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    needs: backend-unit-tests # Opcional: só roda se os testes de backend passarem

    services:
      # Este job também precisa de um banco de dados para o backend
      mysql-db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saboro
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Instalar Dependências do Backend (na raiz)
        run: npm ci

      - name: 4. Instalar Dependências do Frontend (na subpasta)
        # Presumindo que seu frontend está na pasta 'frontend/'
        run: npm ci --prefix frontend

      - name: 5. Rodar Testes E2E (Cypress)
        # Esta ação popular cuida de tudo: instala o Cypress,
        # inicia os servidores (backend e frontend) e roda os testes.
        uses: cypress-io/github-action@v6
        with:
          # Diz ao Cypress onde está o package.json dele
          working-directory: frontend
          
          # Inicia AMBOS os servidores
          start: |
            npm start --prefix ../ & # Inicia o Backend (na pasta pai)
            npm start &              # Inicia o Frontend (na pasta 'frontend')
            
          # Espera o frontend (React) carregar antes de testar
          wait-on: 'http://localhost:3000' 
          wait-on-timeout: 120 # Espera até 2 minutos
          
        env:
          # Env para o Backend (npm start --prefix ../)
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: saboro
          # Env para o Frontend (npm start)
          CI: true