name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # -------------------------
  # 1. BACKEND UNIT TESTS
  # -------------------------
  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: ./backend
        run: npm install

      - name: Run backend UNIT tests
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: npm run test:unit

  # -------------------------
  # 2. BACKEND INTEGRATION TESTS
  # -------------------------
  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests  # só roda depois que passar unit tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saboro_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: ./backend
        run: npm install

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            nc -z 127.0.0.1 3307 && echo "MySQL is ready" && break
            echo "Waiting MySQL..."
            sleep 4
          done

      - name: Run backend INTEGRATION tests
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_USER: root
          DB_PASS: root
          DB_NAME: saboro_test
          NODE_ENV: test
        run: npm run test:integration
