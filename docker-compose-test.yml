version: '3.8'

services:
  db_test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saboro_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_test:
    build: ./backend
    environment:
      DB_HOST: db_test
      DB_USER: root
      DB_PASS: root
      DB_NAME: saboro_test
      NODE_ENV: test
    depends_on:
      db_test:
        condition: service_healthy
